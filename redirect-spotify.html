<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting to Spotify</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Comfortaa', 'Inter', sans-serif;
      text-align: center;
    }
    .btn {
      display: inline-block;
      background: var(--accent);

      padding: 0.75rem 1.5rem;
      border-radius: var(--radius);
      transition: background 0.3s ease;
      margin-top: 2rem;
    }
    .btn:hover {
      background: #00cb96;
    }
  </style>
</head>
<body>
  <h2>You’re about to visit Spotify</h2>

</html>
